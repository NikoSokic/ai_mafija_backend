spring.application.name=ai_mafia_backend

# Render zadaje port preko PORT
server.port=${PORT:8080}

# Supabase Session pooler (radi s IPv4 / kucnog interneta).
# Lozinka se NE pise ovdje: postavi SPRING_DATASOURCE_PASSWORD u Run konfiguraciji (lokalno) ili na Renderu.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.gjckzgemjcfixtcqvwfn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Shemu mijenjaju samo Flyway migracije (src/main/resources/db/migration), same pri pokretanju backenda
spring.jpa.hibernate.ddl-auto=none
# Baza je nastala prije Flywaya, pa se sve migracije pokreću i na njoj; idempotentne su
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger je ugašen osim ako se uključi: lokalno SWAGGER_ENABLED=true, na produkciji se ne postavlja
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Sentry: bez SENTRY_DSN je isključen (lokalno i u testovima). Greške šalje samo log.error.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.send-default-pii=false