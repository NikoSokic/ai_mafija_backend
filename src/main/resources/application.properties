spring.application.name=ai_mafia_backend

# Render zadaje port preko PORT
server.port=${PORT:8080}

# Supabase Session pooler (radi s IPv4 / kucnog interneta).
# Lozinka se NE pise ovdje: postavi SPRING_DATASOURCE_PASSWORD u Run konfiguraciji (lokalno) ili na Renderu.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-eu-central-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.gjckzgemjcfixtcqvwfn}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Shemu mijenjaju samo SQL migracije u db/migrations (pokreću se ručno u Supabase SQL Editoru)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}