# Profil "test": H2 u memoriji u PostgreSQL načinu, testovi nikad ne diraju Supabase.
# build.gradle ga uključuje za sve testove (spring.profiles.active=test).
spring.datasource.url=jdbc:h2:mem:ai_mafia_backend;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# shemu na H2 radi Hibernate; migracije su pisane za PostgreSQL
spring.flyway.enabled=false

# Swagger je u produkciji ugašen; testovi ga uključuju kad ih treba (vidi SwaggerDisabledTests)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# testovi sami pomiču rokove (GamePhaseService.handleTimeout)
app.timers.enabled=false
