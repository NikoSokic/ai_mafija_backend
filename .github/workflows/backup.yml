name: Sigurnosna kopija baze

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    services:
      # samo za probu vraćanja; produkcija se ne dira
      proba:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: proba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Izvoz baze
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
        run: |
          docker run --rm -e BACKUP_DB_URL -v "$PWD:/kopija" postgres:17 \
            sh -c 'pg_dump "$BACKUP_DB_URL" --schema=public --format=custom --no-owner --no-privileges --file=/kopija/kopija.dump'

      # kopija koja se ne može vratiti ne vrijedi ništa: pad ovog koraka znači da noćašnja kopija nije dobra
      - name: Proba vraćanja
        run: |
          docker run --rm --network host -e PGPASSWORD=proba -v "$PWD:/kopija" postgres:17 sh -ec '
            pg_restore --host=localhost --username=postgres --dbname=postgres --clean --if-exists --no-owner --no-privileges --exit-on-error /kopija/kopija.dump
            roles=$(psql --host=localhost --username=postgres --dbname=postgres -Atc "select count(*) from role")
            psql --host=localhost --username=postgres --dbname=postgres -Atc "select (select count(*) from lobby), (select count(*) from player), (select count(*) from game_state)" > /dev/null
            echo "Vraćeno uloga: $roles"
            test "$roles" -ge 6
          '

      # repo je javan, a kopija sadrži tokene igrača
      - name: Šifriranje
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$BACKUP_PASSPHRASE"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output kopija.dump.gpg kopija.dump
          rm -f kopija.dump

      - uses: actions/upload-artifact@v4
        with:
          name: kopija-${{ github.run_number }}
          path: kopija.dump.gpg
          if-no-files-found: error
          retention-days: 7
