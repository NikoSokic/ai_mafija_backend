name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # testovi rade na H2 u memoriji, tajne nisu potrebne
      - run: chmod +x gradlew && ./gradlew build --no-daemon
